version: 2
updates:
  # Fetch and update latest `npm` packages
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - gosferano
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Minor and patch updates land as one PR; majors stay separate
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  # Fetch and update latest `github-actions` pkgs
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees:
      - gosferano
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
